name: Android feature branch preview

on:
  push:
    branches:
      - feature/android-v1.5-gpt-live-background
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    name: Android tests and Preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Run unit tests and build Preview APK
        run: |
          cd android
          ./gradlew --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m" -Pkotlin.compiler.execution.strategy=in-process :core:test :app:testDebugUnitTest :app:assemblePreview
      - name: Upload installable Preview APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-v15-preview
          path: android/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-v15-test-reports
          path: |
            android/core/build/test-results
            android/app/build/test-results
            android/core/build/reports/tests
            android/app/build/reports/tests
          if-no-files-found: warn
          retention-days: 7
